name: bloop
description: "A funny little reminder app to help you stay productive and take breaks."

publish_to: 'none'

version: 1.0.5+6

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  slide_to_act: ^2.0.2
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  just_audio: ^0.9.46
  flutter_local_notifications: ^18.0.1
  flutter_foreground_task: ^6.1.1
  shared_preferences: ^2.2.3
  timezone: ^0.9.4
  uuid: ^4.4.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  flutter_timezone: ^5.0.1
  confetti: ^0.7.0
  path_provider: ^2.1.5
  lucide_icons_flutter: ^4.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  # Sounds and scenery (assets/audio, assets/scenery) are deliberately not
  # bundled; the app downloads them on first use. See remote_asset.dart.

  fonts:
    # Variable fonts (wght axis); licences sit next to them in assets/fonts.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans.ttf

# Android icons (legacy, adaptive, themed, status bar) are rendered straight
# into android/app/src/main/res by tool/render_icons.sh, because the adaptive
# layers are drawn for the safe zone and this tool would inset them again.
# This only produces the iOS icon set, from the opaque master.
flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/icons/icon-master-1024.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#5a5fb0"
  image: "assets/icons/splash-960.png"
  android: true
  ios: false
  web: false
  android_12:
    color: "#5a5fb0"
    image: "assets/icons/splash-960.png"
